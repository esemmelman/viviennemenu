<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brady Menu</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f5f7;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: 100vh;
    }

    .app.service-mode {
      grid-template-columns: 220px 190px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 20px 14px;
      background: #172033;
      box-shadow: 4px 0 18px rgb(15 23 42 / 12%);
    }

    .sidebar label {
      display: block;
      margin-bottom: 9px;
      color: #dbe4f0;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
    }

    #page-list {
      width: 100%;
      min-height: 130px;
      padding: 6px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #fff8c5;
      color: #172033;
      font: inherit;
      cursor: pointer;
    }

    #page-list option {
      padding: 10px 8px;
    }

    #page-list:focus-visible {
      outline: 3px solid #60a5fa;
      outline-offset: 2px;
    }

    .revision {
      margin: 10px 0 0;
      color: #94a3b8;
      font-size: 0.75rem;
      text-align: center;
    }

    .slide-sidebar {
      display: none;
      height: 100vh;
      overflow-y: auto;
      padding: 14px 10px;
      background: #e2e8f0;
      border-right: 1px solid #cbd5e1;
    }

    .service-mode .slide-sidebar {
      display: block;
    }

    .slide-sidebar h2 {
      margin: 0 4px 10px;
      font-size: 0.82rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .slide-list {
      display: grid;
      gap: 10px;
    }

    .slide-button {
      display: block;
      width: 100%;
      padding: 5px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: #fff8c5;
      color: #172033;
      cursor: pointer;
      font: inherit;
      text-align: left;
      box-shadow: 0 2px 7px rgb(15 23 42 / 10%);
    }

    .slide-button:hover {
      border-color: #93c5fd;
    }

    .slide-button.active {
      border-color: #2563eb;
    }

    .slide-button:focus-visible {
      outline: 3px solid #60a5fa;
      outline-offset: 2px;
    }

    .slide-number {
      display: block;
      padding: 10px 6px;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
    }

    .content {
      display: flex;
      justify-content: center;
      position: relative;
      padding: 20px;
      min-width: 0;
    }

    #page-frame {
      width: min(100%, 1200px);
      min-height: calc(100vh - 40px);
      border: 0;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 30px rgb(15 23 42 / 12%);
    }

    .service-beta-panel {
      display: flex;
      width: min(100%, 1200px);
      height: calc(100vh - 40px);
      min-height: 400px;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 10px 30px rgb(15 23 42 / 12%);
    }
    .service-beta-panel[hidden] { display: none; }
    .service-beta-left-rail {
      flex: 0 0 22%;
    }
    .service-beta-image {
      flex: 0 0 56%;
      width: 56%;
      height: 100%;
      object-fit: contain;
      object-position: top left;
      background: #fff;
    }
    .service-beta-rail {
      display: grid;
      flex: 1;
      place-items: start center;
      min-width: 0;
      padding-top: 15px;
    }

    .homework-panel {
      width: min(100%, 900px);
      min-height: calc(100vh - 40px);
      overflow: hidden;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 30px rgb(15 23 42 / 12%);
    }

    .homework-panel[hidden] {
      display: none;
    }

    .service-recording {
      position: relative;
      width: max-content;
      padding: 5px;
      border-radius: 10px;
      background: #fff8c5;
      box-shadow: 0 4px 18px rgb(15 23 42 / 25%);
    }
    .service-recording[hidden] { display: none; }
    .service-recording button { padding: 7px 12px; cursor: pointer; }

    .torah-panel {
      width: min(100%, 900px);
      min-height: calc(100vh - 40px);
      padding: 32px clamp(24px, 5vw, 60px);
      overflow-y: auto;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 30px rgb(15 23 42 / 12%);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.65;
    }

    .torah-panel[hidden] {
      display: none;
    }

    .torah-panel h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
    }

    .torah-reference {
      margin: 4px 0 28px;
      color: #64748b;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .torah-chapter {
      margin: 32px 0 12px;
      font-size: 1.4rem;
    }

    .torah-verse {
      margin: 0 0 0.8em;
      font-size: 1.1rem;
    }

    .verse-number {
      margin-right: 0.35em;
      color: #475569;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 0.72em;
      font-weight: 700;
      vertical-align: super;
    }

    .torah-verse.highlighted {
      padding: 3px 7px;
      border-radius: 4px;
      background: #fff176;
    }

    .torah-status {
      color: #475569;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .editor-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 10px;
      border-bottom: 1px solid #cbd5e1;
      background: #f8fafc;
    }

    .editor-toolbar button {
      min-width: 38px;
      padding: 7px 10px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      background: #fff8c5;
      color: #172033;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .editor-toolbar button:hover {
      background: #fef08a;
    }

    .sync-status {
      margin-left: auto;
      color: #475569;
      font-size: 0.82rem;
      font-weight: 600;
    }

    #homework-editor {
      min-height: calc(100vh - 102px);
      padding: 28px;
      outline: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      line-height: 1.65;
    }

    #homework-editor:empty::before {
      color: #94a3b8;
      content: "Enter homework here…";
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .app {
        grid-template-columns: 150px minmax(0, 1fr);
      }

      .app.service-mode {
        grid-template-columns: 150px 125px minmax(320px, 1fr);
        overflow-x: auto;
      }

      .sidebar,
      .content {
        padding: 10px;
      }

      .slide-sidebar {
        padding: 10px 6px;
      }

      #page-frame {
        min-height: calc(100vh - 20px);
      }

      .service-beta-panel { height: calc(100vh - 20px); }
      .service-recording button { padding: 6px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <label for="page-list">Menu</label>
      <select id="page-list" size="8" aria-label="Choose a page">
        <option value="https://esemmelman.github.io/viviennetimeline/">Timeline</option>
        <option value="https://esemmelman.github.io/viviennetorah/" selected>Torah Reading</option>
        <option value="service-beta">Service</option>
        <option value="https://esemmelman.github.io/Elohai-Neshama/">Elohai</option>
        <option value="torah-portion">Portion in English</option>
        <option value="https://esemmelman.github.io/bradyhaftorah/">Haftorah Reading</option>
        <option value="https://us02web.zoom.us/j/85978948713?pwd=LMmFIfaABzOyuWirX2mpnQgZNVD39E.1">Zoom Link</option>
        <option value="homework">Homework</option>
      </select>
      <p class="revision">Revision 1.17</p>
    </aside>

    <aside id="slide-sidebar" class="slide-sidebar" aria-label="Service slides">
      <h2>Service slides</h2>
      <div id="slide-list" class="slide-list"></div>
    </aside>

    <section class="content" aria-label="Selected page">
      <iframe
        id="page-frame"
        title="Torah Reading"
        src="https://esemmelman.github.io/viviennetorah/"
        loading="eager"
        allow="camera; microphone; autoplay; fullscreen; display-capture"
      ></iframe>

      <div id="service-beta-panel" class="service-beta-panel" hidden>
        <div class="service-beta-left-rail" aria-hidden="true"></div>
        <img id="service-beta-image" class="service-beta-image" alt="">
        <div class="service-beta-rail">
          <div id="service-recording" class="service-recording" hidden>
            <button id="service-record-button" type="button" aria-pressed="false">Record</button>
          </div>
        </div>
      </div>

      <article id="torah-panel" class="torah-panel" aria-labelledby="torah-title" hidden>
        <h1 id="torah-title">Miketz</h1>
        <p class="torah-reference">
          Genesis 41:1–44:17 ·
          <a href="https://www.sefaria.org/Genesis.41?lang=en" target="_blank" rel="noopener">Revised JPS, 2023 via Sefaria</a>
          · CC BY-NC
        </p>
        <div id="torah-text" aria-live="polite">
          <p class="torah-status">Loading Torah portion…</p>
        </div>
      </article>

      <div id="homework-panel" class="homework-panel" hidden>
        <div class="editor-toolbar" role="toolbar" aria-label="Homework formatting">
          <button type="button" data-command="bold" aria-label="Bold"><strong>B</strong></button>
          <button type="button" data-command="italic" aria-label="Italic"><em>I</em></button>
          <button type="button" data-command="underline" aria-label="Underline"><u>U</u></button>
          <button type="button" data-command="insertUnorderedList" aria-label="Bulleted list">• List</button>
          <button type="button" data-command="insertOrderedList" aria-label="Numbered list">1. List</button>
          <span id="sync-status" class="sync-status" aria-live="polite">Loading…</span>
        </div>
        <div
          id="homework-editor"
          contenteditable="true"
          role="textbox"
          aria-label="Homework"
          aria-multiline="true"
        ></div>
      </div>
    </section>
  </main>

  <script>
    const presentationId = "1oC5QAqCPf49T3vI0fOJXYMrkAbRCRafq4r0UDO-VxZI";
    const supabaseUrl = "https://fgomaujsdblpzxhnnqrg.supabase.co";
    const supabaseKey = "sb_publishable_JOUqLZDnfGu_yCa6k6FVDQ_AYwpr72i";
    const homeworkEndpoint = `${supabaseUrl}/rest/v1/bradymenu_homework_documents?document_key=eq.homework`;
    const serviceSlides = [
      { id: "p", page: "289", title: "Tallit" },
      { id: "g3eb74f277b9_0_1", page: "290", title: "Mah Tovu" },
      { id: "g3eb74f277b9_0_9", page: "292", title: "Elohai" },
      { id: "g3eb74f277b9_0_22", page: "296", title: "Laasok" },
      { id: "g3eb74f277b9_0_32", page: "297", title: "Hamlamed" },
      { id: "g3eb74f277b9_0_41", page: "298", title: "Limitless" },
      { id: "g3eb74f277b9_0_48", page: "313", title: "Barchu" },
      { id: "g3eb74f277b9_0_61", page: "313", title: "Yotzer Ohr" },
      { id: "g3eb74f277b9_0_69", page: "314", title: "The World" },
      { id: "g3eb7772bc9b_0_0", page: "317", title: "O God" },
      { id: "g3eb7772bc9b_0_7", page: "318", title: "Shema" },
      { id: "g3eb7772bc9b_0_16", page: "319", title: "V'ahavta" },
      { id: "g3eb7772bc9b_0_25", page: "320", title: "Adonai" },
      { id: "g3eb7772bc9b_0_32", page: "322", title: "Mi Chamocha" },
      { id: "g3eb7772bc9b_0_40", page: "323", title: "Amidah" },
      { id: "g3eb7772bc9b_0_50", page: "325", title: "G'vurah" },
      { id: "g3eb7772bc9b_0_59", page: "326", title: "Nekadesh" },
      { id: "g3e705dc12d8_0_0", page: "329", title: "Yismechu" },
      { id: "g3e705dc12d8_0_9", page: "329", title: "The Meaning" },
      { id: "g3e705dc12d8_0_18", page: "330", title: "On this" },
      { id: "g3e705dc12d8_0_25", page: "332", title: "Modim" },
      { id: "g3e705dc12d8_0_34", page: "333", title: "Modim" },
      { id: "g3e705dc12d8_0_44", page: "334", title: "Sim Shalom" },
      { id: "g3e740b7777b_0_0", page: "368", title: "Torah Blessings" },
      { id: "g3f776c0633e_0_20", page: "372", title: "Haftorah Blessings" }
    ];
    // Slides with a red outlined passage in the Service presentation.
    const recordableSlideIds = new Set([
      "p", "g3eb74f277b9_0_9", "g3eb74f277b9_0_22", "g3eb74f277b9_0_32",
      "g3eb74f277b9_0_41", "g3eb74f277b9_0_61", "g3eb74f277b9_0_69",
      "g3eb7772bc9b_0_0", "g3eb7772bc9b_0_16", "g3eb7772bc9b_0_25",
      "g3e705dc12d8_0_9", "g3e705dc12d8_0_18", "g3e705dc12d8_0_25",
      "g3e705dc12d8_0_34", "g3e740b7777b_0_0", "g3f776c0633e_0_20"
    ]);
    const app = document.querySelector(".app");
    const pageList = document.querySelector("#page-list");
    const pageFrame = document.querySelector("#page-frame");
    const slideList = document.querySelector("#slide-list");
    const serviceBetaPanel = document.querySelector("#service-beta-panel");
    const serviceBetaImage = document.querySelector("#service-beta-image");
    const serviceRecording = document.querySelector("#service-recording");
    const torahPanel = document.querySelector("#torah-panel");
    const torahText = document.querySelector("#torah-text");
    const homeworkPanel = document.querySelector("#homework-panel");
    const homeworkEditor = document.querySelector("#homework-editor");
    const syncStatus = document.querySelector("#sync-status");
    let homeworkLoaded = false;
    let torahLoaded = false;
    let homeworkDirty = false;
    let homeworkUpdatedAt = "";
    let saveTimer;
    let selectedPageIndex = pageList.selectedIndex;

    const supabaseHeaders = {
      apikey: supabaseKey,
      Authorization: `Bearer ${supabaseKey}`,
      "Content-Type": "application/json"
    };

    async function loadHomework() {
      try {
        const response = await fetch(`${homeworkEndpoint}&select=content_html,updated_at`, {
          headers: supabaseHeaders,
          cache: "no-store"
        });
        if (!response.ok) throw new Error(`Load failed (${response.status})`);
        const [documentRow] = await response.json();
        if (!homeworkDirty && documentRow && documentRow.updated_at !== homeworkUpdatedAt) {
          homeworkEditor.innerHTML = documentRow.content_html;
          homeworkUpdatedAt = documentRow.updated_at;
        }
        homeworkLoaded = true;
        syncStatus.textContent = "Synced";
      } catch (error) {
        syncStatus.textContent = "Unable to sync";
        console.error(error);
      }
    }

    async function saveHomework() {
      if (!homeworkDirty) return;
      syncStatus.textContent = "Saving…";
      try {
        const response = await fetch(homeworkEndpoint, {
          method: "PATCH",
          headers: { ...supabaseHeaders, Prefer: "return=representation" },
          body: JSON.stringify({
            content_html: homeworkEditor.innerHTML,
            updated_at: new Date().toISOString()
          })
        });
        if (!response.ok) throw new Error(`Save failed (${response.status})`);
        const [documentRow] = await response.json();
        homeworkUpdatedAt = documentRow.updated_at;
        homeworkDirty = false;
        syncStatus.textContent = "Saved and synced";
      } catch (error) {
        syncStatus.textContent = "Save failed — retrying";
        console.error(error);
        saveTimer = setTimeout(saveHomework, 3000);
      }
    }

    homeworkEditor.addEventListener("input", () => {
      homeworkDirty = true;
      syncStatus.textContent = "Unsaved changes";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveHomework, 800);
    });

    document.querySelectorAll("[data-command]").forEach((button) => {
      button.addEventListener("mousedown", (event) => event.preventDefault());
      button.addEventListener("click", () => {
        homeworkEditor.focus();
        document.execCommand(button.dataset.command, false);
        homeworkEditor.dispatchEvent(new Event("input"));
      });
    });

    setInterval(() => {
      if (!homeworkPanel.hidden && homeworkLoaded && !homeworkDirty) loadHomework();
    }, 5000);

    function serviceUrl(slideId) {
      return `https://docs.google.com/presentation/d/${presentationId}/embed?slide=id.${slideId}`;
    }

    async function loadTorahPortion() {
      if (torahLoaded) return;

      torahText.innerHTML = '<p class="torah-status">Loading Torah portion…</p>';
      try {
        const chapterNumbers = [41, 42, 43, 44];
        const jpsVersion = encodeURIComponent("english|THE JPS TANAKH: Gender-Sensitive Edition");
        const responses = await Promise.all(chapterNumbers.map((chapter) =>
          fetch(`https://www.sefaria.org/api/v3/texts/Genesis%20${chapter}?version=${jpsVersion}&return_format=text_only`)
        ));
        if (responses.some((response) => !response.ok)) throw new Error("Unable to load one or more chapters");

        const chapters = await Promise.all(responses.map((response) => response.json()));
        torahText.replaceChildren();
        chapters.forEach((chapterData) => {
          const chapterNumber = Number(chapterData.sections[0]);
          const verses = chapterData.versions[0]?.text;
          if (!Array.isArray(verses)) throw new Error(`Revised JPS text unavailable for Genesis ${chapterNumber}`);

          const heading = document.createElement("h2");
          heading.className = "torah-chapter";
          heading.textContent = `Genesis ${chapterNumber}`;
          torahText.append(heading);

          verses
            .map((text, index) => ({ verse: index + 1, text }))
            .filter((verse) => chapterNumber !== 44 || verse.verse <= 17)
            .forEach((verse) => {
              const paragraph = document.createElement("p");
              paragraph.className = "torah-verse";
              if (chapterNumber === 42 && verse.verse >= 8 && verse.verse <= 23) {
                paragraph.classList.add("highlighted");
              }

              const number = document.createElement("span");
              number.className = "verse-number";
              number.textContent = verse.verse;
              paragraph.append(number, document.createTextNode(verse.text));
              torahText.append(paragraph);
            });
        });
        torahLoaded = true;
      } catch (error) {
        torahText.innerHTML = '<p class="torah-status">The Torah portion could not be loaded. Please check your connection and try again.</p>';
        console.error(error);
      }
    }

    function selectSlide(button, slide) {
      window.stopServiceRecording?.();
      const isServiceBeta = pageList.value === "service-beta";
      serviceRecording.hidden = true;
      document.querySelectorAll(".slide-button").forEach((item) => {
        item.classList.toggle("active", item === button);
        item.setAttribute("aria-current", item === button ? "true" : "false");
      });
      if (isServiceBeta) {
        serviceBetaImage.dataset.slideId = slide.id;
        serviceBetaImage.onload = () => {
          if (pageList.value === "service-beta" && serviceBetaImage.dataset.slideId === slide.id) {
            serviceRecording.hidden = !recordableSlideIds.has(slide.id);
          }
        };
        serviceBetaImage.src = `service-slides/${slide.id}.png`;
        serviceBetaImage.alt = `Service — ${slide.title}`;
      } else {
        serviceBetaImage.onload = null;
        pageFrame.src = serviceUrl(slide.id);
      }
      window.servicePassageTitle = slide.title;
      pageFrame.title = slide.title
        ? `Service — ${slide.title}`
        : slide.page
          ? `Service — page ${slide.page}`
          : "Service — final slide";
    }

    serviceSlides.forEach((slide, index) => {
      const button = document.createElement("button");
      const slideNumber = index + 1;
      const slideLabel = slide.title || (slide.page ? `Page ${slide.page}` : "Final slide");
      button.type = "button";
      button.className = "slide-button";
      button.dataset.slideNumber = slideNumber;
      button.innerHTML = `
        <span class="slide-number">${slideLabel}</span>
      `;
      button.addEventListener("click", () => selectSlide(button, slide));
      slideList.append(button);
    });

    pageList.addEventListener("change", () => {
      const selected = pageList.options[pageList.selectedIndex];
      if (selected.text === "Zoom Link") {
        window.open(selected.value, "_blank", "noopener,noreferrer");
        pageList.selectedIndex = selectedPageIndex;
        return;
      }

      selectedPageIndex = pageList.selectedIndex;
      const isServiceBeta = selected.value === "service-beta";
      const isService = selected.text === "Service" || isServiceBeta;
      const isHomework = selected.value === "homework";
      const isTorahPortion = selected.value === "torah-portion";
      app.classList.toggle("service-mode", isService);
      serviceRecording.hidden = true;
      serviceBetaPanel.hidden = !isServiceBeta;
      pageFrame.hidden = isHomework || isTorahPortion || isServiceBeta;
      homeworkPanel.hidden = !isHomework;
      torahPanel.hidden = !isTorahPortion;

      if (isService) {
        const firstSlide = document.querySelector(".slide-button");
        selectSlide(firstSlide, serviceSlides[0]);
      } else if (isHomework) {
        loadHomework();
        homeworkEditor.focus();
      } else if (isTorahPortion) {
        loadTorahPortion();
      } else {
        if (selected.text === "Timeline") {
          // A previous deployment's cached HTML can point to removed scripts.
          const timelineUrl = new URL(selected.value);
          timelineUrl.searchParams.set("launch", String(Date.now()));
          pageFrame.src = timelineUrl.href;
        } else {
          pageFrame.src = selected.value;
        }
        pageFrame.title = selected.text;
      }
    });
  </script>
  <script src="service-recordings.js?v=1.16"></script>
</body>
</html>
